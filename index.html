    const aliases = { home: 'index', '': 'index' };
    const frame = document.getElementById('music-site');
    let currentPage = null;

    function requestedPage() {
      const value = decodeURIComponent(location.hash.slice(1)).replace(/^\//, '').toLowerCase();
      return pages[value] ? value : (aliases[value] || 'index');
    }

    function showPage() {
      const page = requestedPage();
      if (page === currentPage) return;
      currentPage = page;
      document.title = page === 'index' ? 'Chord Nexus' : `Chord Nexus — ${page.replace(/-/g, ' ')}`;
      frame.srcdoc = pages[page];
    }

    window.addEventListener('hashchange', showPage);
    window.addEventListener('message', (event) => {
      if (event.source !== frame.contentWindow || !event.data || event.data.type !== 'music-site-route') return;
      location.hash = event.data.page === 'index' ? 'home' : event.data.page;
    });
    showPage();
  </script>
